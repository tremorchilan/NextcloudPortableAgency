# Portable Agency CRM — single-container app deploy.
#
# Brings up the Next.js app. Supabase (Postgres + Auth) and a Meta
# WhatsApp Business app are external dependencies you must provision
# separately (see docs/deployment-portable.md). Apply the migrations in
# supabase/migrations/ to your Supabase project first.
#
# Usage:
#   1. cp .env.local.example .env.local   # fill in Supabase + Meta creds
#   2. docker compose up --build
#   3. open http://localhost:3000
#
# Branding build args fall back to the Nextcloud Portable Agency defaults
# when omitted. Override per deployment by setting them in the environment
# (they're picked up as compose build args).

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Portable Agency CRM}
        NEXT_PUBLIC_BRAND_SHORT: ${NEXT_PUBLIC_BRAND_SHORT:-PACRM}
        NEXT_PUBLIC_BRAND_TAGLINE: ${NEXT_PUBLIC_BRAND_TAGLINE:-Self-hostable WhatsApp CRM for portable agencies}
        NEXT_PUBLIC_BRAND_PRIMARY: ${NEXT_PUBLIC_BRAND_PRIMARY:-#0082c9}
        NEXT_PUBLIC_BRAND_SUPPORT_EMAIL: ${NEXT_PUBLIC_BRAND_SUPPORT_EMAIL:-support@example.com}
        NEXT_PUBLIC_BRAND_SITE_URL: ${NEXT_PUBLIC_BRAND_SITE_URL:-}
    image: portable-agency-crm:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
